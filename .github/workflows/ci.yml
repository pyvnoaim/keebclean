name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type-check speed
        # an expression that's slow here fails outright on some compilers ("unable to type-check in reasonable time")
        run: swiftc -typecheck -warnings-as-errors -Xfrontend -warn-long-expression-type-checking=200 main.swift
      - name: Build
        run: make
      - name: Self-check (demo mode)
        run: make test
