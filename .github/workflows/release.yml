name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag
        run: |
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "tag must look like v1.2.3" >&2; exit 1 ;; esac
      - name: Build universal binary
        run: |
          sed -i '' "s/^let version = \"dev\"/let version = \"${GITHUB_REF_NAME#v}\"/" main.swift
          grep -q "^let version = \"${GITHUB_REF_NAME#v}\"" main.swift
          swiftc -O -target arm64-apple-macos12 main.swift -o keebclean-arm64
          swiftc -O -target x86_64-apple-macos12 main.swift -o keebclean-x86_64
          lipo -create keebclean-arm64 keebclean-x86_64 -output keebclean
          ./keebclean --demo --mute < /dev/null > /dev/null
          tar -czf keebclean-macos-universal.tar.gz keebclean README.md LICENSE  # fixed name: install.sh fetches latest/download
          shasum -a 256 keebclean-*.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |  # re-running a failed job replaces the assets instead of failing on the existing release
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" keebclean-*.tar.gz checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" keebclean-*.tar.gz checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
          fi
