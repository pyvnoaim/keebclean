name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal binary
        run: |
          swiftc -O -target arm64-apple-macos12 main.swift -o keebclean-arm64
          swiftc -O -target x86_64-apple-macos12 main.swift -o keebclean-x86_64
          lipo -create keebclean-arm64 keebclean-x86_64 -output keebclean
          ./keebclean --demo --mute < /dev/null > /dev/null
          tar -czf "keebclean-$GITHUB_REF_NAME-macos-universal.tar.gz" keebclean README.md LICENSE
          shasum -a 256 keebclean-*.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" keebclean-*.tar.gz checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
